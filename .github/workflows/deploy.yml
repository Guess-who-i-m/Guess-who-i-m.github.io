name: Deploy to GitHub Pages

on:
  push:
    branches: [main]  # 触发分支

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: |
          echo "VITE_GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" >> .env
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}  # 使用 Secrets 中的 Token
          publish_dir: ./docs  # 你的构建输出目录
